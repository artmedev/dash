services:
  db:
    image: postgres:16-alpine
    container_name: dash_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dash
      POSTGRES_PASSWORD: dash
      POSTGRES_DB: dash
    ports:
      - "5434:5432"
    volumes:
      - dash_pgdata:/var/lib/postgresql/data
volumes:
  dash_pgdata:
